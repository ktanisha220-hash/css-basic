<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin:0px;
        padding:0px;
    }
    .Container{
        border:4px solid black;
        height: 100vh;
        background-color:whitesmoke;
        display:flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        }
        .box{
            height: 500px;
            width: 500px;
            background-color:lightblue ;
            border-radius:10px;
            }
        .box1{
            border:2px solid lightblue;
            border-radius: 10px;
            background-color: lightblue;
            display:flex;
            justify-content: center;
            align-items: center;

        }
        .box2{
            border:2px solid lightblue;
            border-radius: 10px;
            background-color:lightblue;
            display:flex;
            flex-direction: column;
            align-items: center;
            font-style:oblique;
        }
        p{
            font: 1em sans-serif;
            font-size: large;
            font-style: oblique;
            background-color: lightblue;

        }
        button{
            background-color: yellow;
        }
        
        </style>
<body>
    <div class="Container">
        <div class="box">
            <div class="box1">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSsuHAJCW-qz5sZZQS8fORe9zNEXzjZm9WTJerrJwOx1A&s=10" alt="headphone" height="300" width="500px">
            </div>
            <div class="box2">
                <h1>Wireless Headphone</h1>
                <h2>Price: $100</h2>
                <p>Experience crystal-clear sound with our latest wireless headphone.<br> Perfect for music lovers and professionals alike.</p>
                <button>⭐4.5/5</button>
                <button>ADD TO CART</button>
                <br>
            </div>
        </div>
    </div>
    
</body>
</html>
